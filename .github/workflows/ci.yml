name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 六道关卡（lint→typecheck→quality→tickets→unit→build+e2e）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0：尾注检查需要事件基线（push 的 before / PR 的 base sha）
      # 出现在本地历史内；merge commit 的 git log -1 拿不到源提交的尾注，会误杀合法 PR
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 24（ABI 137）与本地开发一致：better-sqlite3 12.11.1 的预编译
          # 资产只在 npmmirror 镜像上有 node-v137；Node 20（ABI 115）无预编译
          # 会回退 node-gyp 源码编译并在 runner 的 VS 18 上失败（首跑实证）。
          # Electron 运行时不受影响——e2e/build 用 electron-v146 绑定独立切换。
          node-version: 24
          cache: npm

      - name: 安装依赖（npm ci，lockfile 冻结）
        run: npm ci

      - name: 依赖变更尾注检查（[dep-change]）
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::基线不可用（新分支首推或强推重写），跳过尾注检查"
            exit 0
          fi
          if git diff --name-only "$BASE..HEAD" | grep -E '^(package(-lock)?\.json)$' >/dev/null; then
            if ! git log --format=%B "$BASE..HEAD" | grep -q '\[dep-change\]'; then
              echo "::error::package.json/lock 变更必须带 [dep-change] 提交尾注（K4 依赖防线）"
              exit 1
            fi
          fi
          echo "依赖无变更或已带尾注"

      - name: 受锁文件完整性（locks）
        run: node scripts/check-locks.mjs

      - name: 质量扫描（quality）
        run: node scripts/check-quality.mjs

      - name: 工单一致性（tickets）
        run: node scripts/check-tickets.mjs

      - name: Lint（max-lines 500 + 分层边界）
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单测 + 契约 + 覆盖率（vitest）
        run: npm run test -- --coverage

      - name: 构建（electron-vite build）
        run: npm run build

      - name: e2e（Playwright _electron，产物已就绪不重复构建）
        run: npx playwright test
        env:
          CI: 'true'

      - name: 上传 e2e 失败产物（报告与 trace）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: 依赖审计（高危即红）
        run: npm audit --omit=dev --audit-level=high

  lock-change-guard:
    name: manifest 变更尾注检查（[locked-change]）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查 locks/manifest.json 变更需带 [locked-change]
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::基线不可用（新分支首推或强推重写），跳过尾注检查"
            exit 0
          fi
          if git diff --name-only "$BASE..HEAD" | grep -E '^locks/manifest\.json$' >/dev/null; then
            if ! git log --format=%B "$BASE..HEAD" | grep -q '\[locked-change\]'; then
              echo "::error::manifest 变更必须带 [locked-change] 提交尾注（K2 防作弊双锁）"
              exit 1
            fi
          fi
          echo "manifest 无变更或已带尾注"

      # [F-TESTREF-00] 测试重构战役范围闸（设计定稿 §7-W7 终案：逐提交判定）。
      # 带 [test-refactor] 尾注的提交 diff 路径必须 ⊆ 战役白名单（src/** 一律红）。
      # 尾注自愿制=设计 W7 语义（W2 门一裁定接受）：测试面另有 locks sha 锁+
      # [locked-change] guard 独立守护，本范围闸=战役附加层，无强制闭合非缺陷。
      # package.json 放行论证=依赖变更已被 verify job 的 [dep-change] guard 独立
      # 拦截，双闸正交。scripts/audits/** 为本仓证据目录实态（设计白名单
      # docs/audits/** 之外补登——实现票自裁申报在档）。
      # W3（门一回炉）：白名单正则带结尾锚（禁 scripts/check-test-surface-evil/
      # 前缀逃逸）。W1（门一回炉）：git diff-tree -m -r 取 merge 双父并集（保守向）。
      # W4（门一回炉）：BASE 不可达先 fetch origin main 兜底 merge-base，仍失败
      # 才跳过且 notice 升 warning。
      - name: 测试重构战役范围闸（[test-refactor]）
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "事件基线不可达，尝试 origin/main 兜底（门一 W4）"
            git fetch origin main >/dev/null 2>&1 || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::基线不可用（新分支首推/强推重写且 origin/main 兜底失败），跳过范围闸（门一 W4）"
            exit 0
          fi
          TR_RE='^tests/|^scripts/(check-test-surface(\.mjs)?$|test-surface(\.mjs)?$|test-surface/|test-surface\.(baseline|exemptions)\.json$)|^\.github/workflows/|^package(-lock)?\.json$|^docs/prompts/|^docs/design/|^tickets/registry\.ts$|^locks/manifest\.json$|^AGENTS\.md$|^docs/(methodology|invariants)\.md$|^docs/audits/|^scripts/audits/'
          BAD=0
          for C in $(git log --format=%H "$BASE..HEAD"); do
            if git log -1 --format=%B "$C" | grep -q '\[test-refactor\]'; then
              OFF=$(git diff-tree --no-commit-id --name-only -m -r "$C" | grep -Ev "$TR_RE" || true)
              if [ -n "$OFF" ]; then
                echo "::error::提交 ${C:0:8} 带 [test-refactor] 但 diff 超出战役白名单（src/** 等禁止；门一 W1/W3 修正版）："
                echo "$OFF"
                BAD=1
              fi
            fi
          done
          if [ "$BAD" -eq 0 ]; then echo "范围闸通过（无 [test-refactor] 提交或全部在白名单内）"; fi
          exit $BAD
